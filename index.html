/* toast message on the plate */

.pap>*{position:relative;z-index:1}
.panel{width:80%;max-height:90%;overflow:auto;padding:2.2em 3.2em;line-height:1.65;font-size:1.05em}

#dplate{position:absolute;left:1.85%;top:65.14%;width:95.57%;aspect-ratio:1598/261;cursor:default}

 font-weight:400;font-style:normal;-webkit-text-stroke:0;

<script>
/* torn paper edges: a jagged clip-path that always matches the real size of the sheet */
(function(){
 function rnd(seed){let x=seed*2654435761%4294967296;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}}
 function tear(el){
  const w=el.offsetWidth,h=el.offsetHeight;if(w<20||h<20)return;
  if(el._tw===w&&el._th===h)return;el._tw=w;el._th=h;
  const r=rnd(w*7+h*13+(el.id?el.id.length*31:5)),pts=[];
  const amp=Math.max(5,Math.min(9,Math.min(w,h)*0.016)),step=Math.max(12,amp*2.6);
  const j=()=>{const v=r();return (v>.93?amp*1.9:v*amp)};
  for(let x=0;x<w;x+=step*(.6+r()*.8))pts.push([x,j()]);
  for(let y=0;y<h;y+=step*(.6+r()*.8))pts.push([w-j(),y]);
  for(let x=w;x>0;x-=step*(.6+r()*.8))pts.push([x,h-j()]);
  for(let y=h;y>0;y-=step*(.6+r()*.8))pts.push([j(),y]);
  el.style.clipPath='polygon('+pts.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')';
 }
 const ro=new ResizeObserver(es=>es.forEach(e=>tear(e.target)));
 document.querySelectorAll('.pap').forEach(el=>{ro.observe(el);tear(el)});
})();
</script>
